services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mila
      POSTGRES_USER: mila
      POSTGRES_PASSWORD: mila_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - mila_pg:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:1.82.4
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Bogota
      N8N_ENCRYPTION_KEY: mila-dev-encryption-key-32chars
    volumes:
      - mila_n8n:/home/node/.n8n

volumes:
  mila_pg:
  mila_n8n:
